name: golangci-lint
on:
    pull_request:

jobs:
    golangci:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.24.x"
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v6
              with:
                  version: v1.64.8
                  only-new-issues: true
                  args: --timeout 3m --verbose
